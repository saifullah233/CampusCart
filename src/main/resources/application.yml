spring:
  application:
    name: campuscart-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campuscart}
    username: ${DB_USERNAME:campuscart}
    password: ${DB_PASSWORD}

  jpa:
    # Flyway owns the schema. Hibernate only verifies entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Store/read all TIMESTAMP/DATETIME values in UTC so Instant round-trips
        # deterministically regardless of the JVM/DB session time zone.
        jdbc:
          time_zone: UTC
        # Batch LAZY association initialisations into IN-clause loads so paged list
        # endpoints cannot silently degrade into per-row N+1 lookups.
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

security:
  jwt:
    issuer: ${JWT_ISSUER:campuscart}
    # Required at runtime. There is deliberately no source-controlled fallback.
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With
  otp:
    ttl: ${OTP_TTL:5m}
    resend-cooldown: ${OTP_RESEND_COOLDOWN:60s}
    rate-window: ${OTP_RATE_WINDOW:15m}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    max-sends-per-window: ${OTP_MAX_SENDS_PER_WINDOW:5}
    code-length: ${OTP_CODE_LENGTH:6}
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    window: ${LOGIN_RATE_WINDOW:15m}
    lockout: ${LOGIN_LOCKOUT:15m}

cloudinary:
  enabled: ${CLOUDINARY_ENABLED:false}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

mail:
  from: ${MAIL_FROM:noreply@campuscart.local}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_PHONE_NUMBER:${TWILIO_FROM_NUMBER:}}

fast2sms:
  api-key: ${FAST2SMS_API_KEY:}
  whatsapp-message-id: ${FAST2SMS_WHATSAPP_MESSAGE_ID:}
  whatsapp-phone-number-id: ${FAST2SMS_WHATSAPP_PHONE_NUMBER_ID:}

msg91:
  auth-key: ${MSG91_AUTH_KEY:}
  template-id: ${MSG91_TEMPLATE_ID:}

sms:
  gateway-url: ${SMS_GATEWAY_URL:}
  api-key: ${SMS_API_KEY:}

logging:
  level:
    root: INFO
    com.campuscart: INFO

---
# Activated inside docker-compose (SPRING_PROFILES_ACTIVE=docker). Points the
# datasource at the compose service host instead of localhost.
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/campuscart}
