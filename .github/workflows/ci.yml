name: CI

# Build, test (Testcontainers MySQL), package the jar, and verify the Docker image
# builds. GitHub-hosted ubuntu runners ship with a Docker daemon, so the
# Testcontainers-based integration tests run without extra setup, and the app
# supplies its own datasource + JWT secret in tests via @DynamicPropertySource
# (no secrets required in CI).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test, and package
        run: mvn -B -ntp clean verify

      - name: Verify jar artifact was produced
        run: test -f target/campuscart-backend.jar

      - name: Upload application jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: campuscart-backend-jar
          path: target/campuscart-backend.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Verifies the production image builds end-to-end (multi-stage, non-root,
      # healthcheck). No push — this is a build-verification gate only.
      - name: Build image (no push)
        run: docker build -t campuscart-backend:ci .
